
name: Deploy Vite App to Hostinger

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Vite Project
        run: npm run build

      - name: Add Apache routing configuration
        run: |
          test -f .htaccess
          cp .htaccess dist/.htaccess
          test -f dist/index.html
          ls -la dist

      - name: Clean old files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd /home/u341560007/domains/customersdelight.com/public_html
            find . -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

      - name: Deploy dist folder to Hostinger
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*,dist/.htaccess"
          target: "/home/u341560007/domains/customersdelight.com/public_html/"
          strip_components: 1
